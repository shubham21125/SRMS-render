{% extends 'admin_base.html' %} 
{% load static %}
{% block content %}

<div class="container">
    <h2 class="mb-4 gsap-left"><i class="fas fa-plus"></i> Add Subject Combination</h2>
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label for="class" class="form-label">Select Class</label>
            <select class="form-select" id="class" name="class" required>
                    <option value="">--Select Class--</option>
                    {% for i in classes%}
                        <option value="{{ i.id }}">{% if i.branch %}[{{ i.branch.branch_code }}] {% endif %}{{ i.class_name }} - Section {{ i.section }}</option>
                    {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label for="subject" class="form-label">Select Subject</label>
            <select class="form-select" id="subject" name="subject" required>
                    <option value="">--Select Subject--</option>
                    {% for i in subjects %}
                        <option value="{{ i.id }}">{{ i.subject_name }} - {{i.subject_code}}</option>
                    {% endfor %}
            </select>
        </div>

      

        <button type="submit" class="btn btn-success">
            <i class="fas fa-check-circle me-1"></i>Submit
        </button>
    </form>
</div>

{% endblock %}

{% block extra_js %}
<script>
(function() {
  if (typeof gsap === 'undefined') return;

  // Page header slide-in
  gsap.fromTo('h2',
    { opacity: 0, x: -30 },
    { opacity: 1, x: 0, duration: 0.6, ease: 'power3.out', delay: 0.1 }
  );

  // Card(s) entrance
  gsap.fromTo('.card',
    { opacity: 0, y: 40, scale: 0.97 },
    { opacity: 1, y: 0, scale: 1, duration: 0.65, ease: 'back.out(1.4)', delay: 0.2, stagger: 0.08 }
  );

  // Form fields stagger
  gsap.fromTo('.form-control, .form-select, .form-check',
    { opacity: 0, x: -16 },
    { opacity: 1, x: 0, duration: 0.45, stagger: 0.06, ease: 'power3.out', delay: 0.45 }
  );

  // Buttons entrance
  gsap.fromTo('.btn',
    { opacity: 0, y: 12 },
    { opacity: 1, y: 0, duration: 0.4, stagger: 0.07, ease: 'power3.out', delay: 0.75 }
  );

  // Alert slide-in
  document.querySelectorAll('.alert').forEach(function(el) {
    gsap.fromTo(el, { opacity: 0, x: 24 }, { opacity: 1, x: 0, duration: 0.5, ease: 'power3.out' });
  });

  // Focus glow on inputs
  document.querySelectorAll('.form-control, .form-select').forEach(function(inp) {
    inp.addEventListener('focus', function() {
      gsap.to(inp, { boxShadow: '0 0 0 3px rgba(245,197,24,0.18)', duration: 0.2 });
    });
    inp.addEventListener('blur', function() {
      gsap.to(inp, { boxShadow: 'none', duration: 0.2 });
    });
  });

  // Table row stagger (if any)
  gsap.fromTo('tbody tr',
    { opacity: 0, x: -10 },
    { opacity: 1, x: 0, duration: 0.15, stagger: 0.008, ease: 'power2.out', delay: 0.08 }
  );
  
})();
</script>
{% endblock %}
