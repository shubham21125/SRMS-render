{% extends 'base.html' %}
{% block title %}{{ notice.title }} — SRMS{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card gsap-up">
        <div class="card-header py-3" style="border-bottom:2px solid #FFD700;">
          <div class="d-flex align-items-start gap-3">
            <div style="font-size:2rem; color:#FFD700;"><i class="fas fa-bullhorn"></i></div>
            <div>
              <h3 class="mb-1">{{ notice.title }}</h3>
              <small class="text-muted"><i class="far fa-calendar-alt me-1"></i>{{ notice.posting_date|date:"F d, Y" }}</small>
            </div>
          </div>
        </div>
        <div class="card-body p-4">
          <p style="color:#ddd; line-height:1.8; font-size:1rem;">{{ notice.detail }}</p>
          <hr class="y-divider">
          <a href="{% url 'home' %}" class="btn btn-outline-warning">
            <i class="fas fa-arrow-left me-1"></i>Back to Home
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
(function() {
  if (typeof gsap === 'undefined') return;
  gsap.fromTo('.card',
    { opacity: 0, y: 50, scale: 0.96 },
    { opacity: 1, y: 0, scale: 1, duration: 0.75, ease: 'back.out(1.5)', delay: 0.15 }
  );
  gsap.fromTo('.card-header',
    { opacity: 0, x: -20 },
    { opacity: 1, x: 0, duration: 0.5, ease: 'power3.out', delay: 0.45 }
  );
  gsap.fromTo('.card-body',
    { opacity: 0, y: 20 },
    { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out', delay: 0.6 }
  );
  gsap.fromTo('.btn',
    { opacity: 0, y: 12 },
    { opacity: 1, y: 0, duration: 0.4, ease: 'power3.out', delay: 0.8 }
  );
})();
</script>
{% endblock %}
